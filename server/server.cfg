// CS Party server defaults. The plugin sets the match-critical cvars itself (timelimit, team balance,
// freezetime, bot joining); these are the ones that matter before a match starts.
hostname "CS Party"
// sv_lan 1 is right when everyone comes in through the browser relay (it connects from this host).
// Native CS clients over the internet need sv_lan 0 (and UDP 27015 forwarded).
sv_lan 1
log on
mp_timelimit 0
mp_freezetime 0
mp_autoteambalance 0
mp_limitteams 0
bot_quota 4
bot_quota_mode normal
bot_join_after_player 0
bot_difficulty 1
bot_chatter off
