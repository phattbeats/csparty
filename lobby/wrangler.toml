# CS Party lobby API (#3989, design: docs/lobby-design.md).
# Local:  npm run dev   (wrangler dev; secrets from .dev.vars)
# Live:   npx wrangler secret put LOBBY_SECRET   then   npm run deploy   (needs a Workers/DO-scoped API token)
# Admin dashboard (/admin, #3991): npx wrangler secret put ADMIN_TOKEN   (24+ random characters; unset = admin off)
# Only with the Analytics Engine binding (paid, off by default): secrets AE_ACCOUNT_ID and AE_READ_TOKEN (an API token
# with Account Analytics: Read). Everything else on the dashboard works without them.
name = "csparty-lobby"
main = "src/index.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "party.phatt.vip", custom_domain = true }]
workers_dev = true

# public/art/ is gitignored (copied from web/public/art). A bare `wrangler deploy` skipped the copy and shipped
# the page with no logo, portraits or favicon (PHA-4367); the build step runs it for every deploy and dev session.
[build]
command = "npm run art"

[assets]
directory = "./public"
binding = "ASSETS"
# /api/* goes to the Worker; everything else is the static lobby page
run_worker_first = ["/api/*", "/healthz"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# Analytics events (src/analytics.js) are stored in the Directory's SQLite (free plan). Analytics Engine needs
# Workers Paid, so its binding is off: wrangler deploy fails with code 10089 on a free account. To turn it on
# later, add back:
#   [[analytics_engine_datasets]]
#   binding = "EVENTS"
#   dataset = "csparty_events"
# src/index.js writes datapoints only when env.EVENTS exists.

# SQLite-backed Durable Objects: the only kind on the free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Directory"]

# Per-IP limits (#3992, src/index.js LOOKUPS_PER_MIN / JOINS_PER_MIN): approximate, per Cloudflare location. Without
# these bindings the Worker counts per isolate instead.
[[ratelimits]]
name = "LOOKUP_LIMIT"
namespace_id = "3992001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "3992002"
simple = { limit = 20, period = 60 }

# Turnstile on making a party (#3992): npx wrangler secret put TURNSTILE_SECRET, and TURNSTILE_SITEKEY below.
# Either unset = no Turnstile. Test keys for wrangler dev: site key 1x00000000000000000000AA with secret
# 1x0000000000000000000000000000000AA (always passes) or 2x0000000000000000000000000000000AA (always fails).

[vars]
# PHATT ID hub (PHA-4091): lobby checks ?pa= assertions against <hub>/auth/phatt-id/key. Empty = everyone is a guest.
PHATT_HUB = "https://clubhouse.phatt.vip"
# Capacity: game servers that are already running, each behind its own relay (web/relay.js). The relay with
# RELAY_ID=<id> and the same LOBBY_SECRET accepts this Worker's per-lobby tokens as its party key.
# A slot is handed to a lobby only while its relay reports 0 peers, so friends already playing there are safe.
POOL = '[{"id":"raid1","url":"https://csparty.phatt.vip"}]'
MIN_HUMANS = "2"            # auto-start needs this many ready humans (the host can always start, even alone)
AUTOSTART_SECS = "5"        # everyone ready this long -> start
TOKEN_HOURS = "3"           # how long a lobby's party key opens its server
